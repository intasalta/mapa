<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor con Cache Local</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 100vh; width: 100%; margin: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([-24.85, -65.45], 11);

    // Capa base estándar
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Tu capa cacheada localmente desde la carpeta /tiles/
    L.tileLayer('tiles/{z}/{x}/{y}.png', {
      minZoom: 10,
      maxZoom: 13,
      opacity: 0.8,
      attribution: 'Capa WMS Cacheada'
    }).addTo(map);
  </script>
</body>
</html>
