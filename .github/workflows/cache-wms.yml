name: Actualizar Cache de Tiles WMS

on:
  schedule:
    # 03:00 UTC -> 00:00 ART (Si querés 03:00 AM ART exactamente, usa '6 3 * * *')
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub para probar

jobs:
  build-and-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requerido para hacer git push

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar descarga de teselas
        run: python scripts/download_tiles.py

      - name: Commit y Push de teselas actualizadas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tiles/
          if git diff --staged --quiet; then
            echo "No hay cambios en las teselas."
          else
            git commit -m "chore: actualizacion automatica de teselas WMS [skip ci]"
            git push
          fi
